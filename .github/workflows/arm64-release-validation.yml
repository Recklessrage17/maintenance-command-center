name: MCC exact-candidate Debian 13 ARM64 validation
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact unchanged manual candidate commit
        required: true
        type: string
        default: 73819e48432dcbb1ff84898fabc71efc9d6939e9
      validation_package_sha:
        description: Reviewed immutable validation branch commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mcc-manual-native-validation-20261029
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
          architecture: arm64
      - name: Verify reviewed dispatch and package
        env:
          EXPECTED_PACKAGE: ${{ inputs.validation_package_sha }}
          EXPECTED_CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_PACKAGE"
          test "$EXPECTED_CANDIDATE" = 73819e48432dcbb1ff84898fabc71efc9d6939e9
          test "$(uname -m)" = aarch64
          cd validation/manual-native-20261029
          sha256sum -c PUBLICATION-SHA256.txt
      - name: Decrypt exact private source package
        env:
          MCC_NATIVE_VALIDATION_KEY: ${{ secrets.MCC_MANUAL_NATIVE_KEY_20261029 }}
        run: |
          mkdir -p "$RUNNER_TEMP/mcc-input" "$RUNNER_TEMP/mcc-evidence"
          node validation/manual-native-20261029/envelope.mjs decrypt validation/manual-native-20261029/native-input.enc "$RUNNER_TEMP/mcc-input.zip"
          python3 - "$RUNNER_TEMP/mcc-input.zip" "$RUNNER_TEMP/mcc-input" <<'PY'
          import zipfile,pathlib,sys
          allowed={'candidate-source-private.zip','candidate-source-inventory.json','candidate-exact-source.bundle','native-source-pin.json'}
          with zipfile.ZipFile(sys.argv[1])as z:
              assert len(z.namelist())==len(allowed)and set(z.namelist())==allowed
              for name in allowed:(pathlib.Path(sys.argv[2])/name).write_bytes(z.read(name))
          PY
          python3 validation/manual-native-20261029/verify-source.py "$RUNNER_TEMP/mcc-input/candidate-source-private.zip" "$RUNNER_TEMP/mcc-input/candidate-source-inventory.json" "$RUNNER_TEMP/mcc-candidate"
      - name: Attach exact source provenance without changing tested bytes
        run: |
          cd "$RUNNER_TEMP/mcc-candidate"
          git init -q
          git config core.autocrlf input
          git fetch --no-tags https://github.com/Recklessrage17/maintenance-command-center.git c69f8cb6c63922c4f415eacf8ee28e7c056a0a1e
          echo 'a200f49b96c8e0eee861efa21c2098f57adde7f8ec85985a7a2c640b617ba20c  '"$RUNNER_TEMP/mcc-input/candidate-exact-source.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/mcc-input/candidate-exact-source.bundle"
          git fetch "$RUNNER_TEMP/mcc-input/candidate-exact-source.bundle" refs/codex/release-candidates/mcc-manual-20261029-commit
          git read-tree 73819e48432dcbb1ff84898fabc71efc9d6939e9
          git update-ref HEAD 73819e48432dcbb1ff84898fabc71efc9d6939e9
          python3 - <<'PY'
          import subprocess,os
          for entry in subprocess.check_output(['git','ls-files','--stage','-z']).decode().split('\0'):
              if not entry:continue
              metadata,name=entry.split('\t',1)
              if metadata.split()[0]=='100755':os.chmod(name,0o755)
          PY
          test "$(git rev-parse 'HEAD^{tree}')" = db9b7b2bce37aa1a8c3b420de3227f1ed2c32669
          git diff --exit-code
      - name: Build disposable matching Debian runtime
        run: docker build -t mcc-manual-native:reviewed validation/manual-native-20261029
      - name: Execute native validation without production access
        id: validation
        continue-on-error: true
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=10g --cpus=3 --pids-limit=2048 --shm-size=1g --tmpfs /tmp:rw,exec,size=512m \
            --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/mcc-candidate:/work" \
            -v "$RUNNER_TEMP/mcc-evidence:/evidence" \
            -v "$GITHUB_WORKSPACE/validation/manual-native-20261029:/harness:ro" \
            mcc-manual-native:reviewed bash /harness/native-run.sh
      - name: Encrypt private evidence and build outputs
        if: always()
        env:
          MCC_NATIVE_VALIDATION_KEY: ${{ secrets.MCC_MANUAL_NATIVE_KEY_20261029 }}
        run: |
          test -d "$RUNNER_TEMP/mcc-evidence"
          tar -C "$RUNNER_TEMP/mcc-evidence" -czf "$RUNNER_TEMP/mcc-native-results.tar.gz" .
          node validation/manual-native-20261029/envelope.mjs encrypt "$RUNNER_TEMP/mcc-native-results.tar.gz" "$RUNNER_TEMP/mcc-native-results.enc"
          sha256sum "$RUNNER_TEMP/mcc-native-results.enc" > "$RUNNER_TEMP/mcc-native-results.enc.sha256"
      - name: Retain encrypted evidence for local review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcc-manual-native-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mcc-native-results.enc
            ${{ runner.temp }}/mcc-native-results.enc.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Fail closed on native validation failures
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.validation.outcome }}
        run: test "$NATIVE_OUTCOME" = success
