name: MCC isolated native ARM64 validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Approved immutable 2.0.0 candidate SHA (40 hex characters)
        required: true
        type: string
      ubuntu_browser_diagnostics:
        description: Temporary PR205 baseline/candidate browser comparison (does not certify ARM64)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcc-arm64-validation-${{ github.event.pull_request.number || inputs.candidate_sha }}-${{ inputs.ubuntu_browser_diagnostics && 'ubuntu-browser' || 'native' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ubuntu-browser-diagnostics:
    name: Ubuntu browser comparison (${{ matrix.source }})
    if: github.event_name == 'workflow_dispatch' && inputs.ubuntu_browser_diagnostics == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
    env:
      CI: 'true'
      MCC_PLAYWRIGHT_FRONTEND_ONLY: '1'
      PLAYWRIGHT_PM_INPUT_TELEMETRY: 'off'
      EXPECTED_SHA: ${{ matrix.source == 'baseline' && '27a649df2c35448e4d561c110bffa14f9f533d81' || inputs.candidate_sha }}
    steps:
      - name: Check out exact comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Record exact comparison identity
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p diagnostics/playwright/comparison-source
          git rev-parse HEAD > diagnostics/playwright/comparison-source/sha.txt
          printf '%s\n' 'Ubuntu browser diagnostic only; ARM64 jobs are not executed in this mode.' >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install locked test dependencies
        # Dependency/browser caches belong to an explicitly owned setup run too.
        # The managed test invocation below still allocates its own separate runtime.
        id: comparison-setup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createRun} from './scripts/playwright-storage.mjs';
          const run=createRun();
          const values=[`COMPARISON_SETUP_RUN=${run.id}`,`npm_config_cache=${path.join(run.directory,'runtime','npm-cache')}`,`PLAYWRIGHT_BROWSERS_PATH=${path.join(run.directory,'runtime','browsers')}`];
          fs.appendFileSync(process.env.GITHUB_ENV, values.join(String.fromCharCode(10))+String.fromCharCode(10));
          NODE
      - name: Install and build isolated comparison tools
        run: |
          # The first baseline stalled for15 minutes on the Azure package mirror.
          # Both comparison hosts use the same signed Ubuntu archive instead.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm ci --include=dev --no-audit --no-fund
          npm ci --prefix frontend --include=dev --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Build the comparison frontend
        run: npm run build --prefix frontend
      - name: Repeat native mobile PM and maintenance draft cases under contention
        run: npm run test:playwright -- tests/dashboard-pm-alerts.spec.ts tests/warning-issue-lifecycle.spec.ts --project=mobile-chromium --grep 'groups and separates PMs|daily work draft protects' --repeat-each=20 --workers=2 --retries=0 --forbid-only --trace=on
      - name: Verify owned runtime cleanup
        if: always()
        run: |
          if [ -n "${COMPARISON_SETUP_RUN:-}" ]; then
            node scripts/playwright-cleanup.mjs --run "$COMPARISON_SETUP_RUN"
            node scripts/playwright-cleanup.mjs --run "$COMPARISON_SETUP_RUN" --apply
          fi
          node scripts/playwright-cleanup.mjs
          node --input-type=module -e "import fs from 'node:fs'; const p='tmp/playwright-runs'; if(fs.existsSync(p) && fs.readdirSync(p).length) throw new Error('Managed runtime retained; inspect before explicit cleanup');"
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-browser-${{ matrix.source }}-${{ github.run_attempt }}
          path: diagnostics/playwright/
          retention-days: 90

  compatibility:
    name: Native ARM64 compatibility and bounded profile
    if: >-
      github.repository == 'Recklessrage17/maintenance-command-center' &&
      inputs.ubuntu_browser_diagnostics != true &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["codex/mcc-2-0-0-release-candidate","chore/remove-old-qa-screenshots-20261021"]'), github.event.pull_request.head.ref)))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CI: 'true'
      MCC_ARM64_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      MCC_ARM64_PACKAGE: ${{ github.workspace }}/validation-package
      MCC_ARM64_CANDIDATE: ${{ github.workspace }}/candidate
      MCC_ARM64_LEGACY: ${{ github.workspace }}/legacy-source
    steps:
      - name: Set isolated evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/mcc-arm64-evidence/compatibility"
          printf 'MCC_ARM64_EVIDENCE=%s/mcc-arm64-evidence/compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out validation package head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          path: validation-package
          persist-credentials: false
      - name: Check out exact approved 2.0.0 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Check out historical synthetic migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3929a957d4f633d8129997ed1eec818e2e3efbdb
          path: legacy-source
          persist-credentials: false
      - name: Set up native Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          architecture: arm64
      - name: Verify pinned source and native runtime
        run: |
          test "$(uname -m)" = aarch64
          test "$(node -p process.arch)" = arm64
          node "$MCC_ARM64_PACKAGE/validation/arm64/verify-package.mjs"
          node "$MCC_ARM64_PACKAGE/validation/arm64/runtime.mjs"
      - name: Install locked candidate and historical dependencies
        timeout-minutes: 8
        run: |
          npm ci --prefix "$MCC_ARM64_CANDIDATE" --include=dev --no-audit --no-fund
          npm ci --prefix "$MCC_ARM64_CANDIDATE/frontend" --include=dev --no-audit --no-fund
          npm ci --prefix "$MCC_ARM64_CANDIDATE/backend" --include=dev --no-audit --no-fund
          npm ci --prefix "$MCC_ARM64_LEGACY/backend" --include=dev --no-audit --no-fund
      - name: Production builds
        timeout-minutes: 6
        env:
          NODE_ENV: production
        run: |
          npm run build --prefix "$MCC_ARM64_CANDIDATE/frontend" > "$MCC_ARM64_EVIDENCE/frontend-build.log" 2>&1
          npm run build --prefix "$MCC_ARM64_CANDIDATE/backend" > "$MCC_ARM64_EVIDENCE/backend-build.log" 2>&1
          npm run build --prefix "$MCC_ARM64_LEGACY/backend" > "$MCC_ARM64_EVIDENCE/legacy-build.log" 2>&1
      - name: Offline synthetic migration, recovery and authorization suites
        timeout-minutes: 14
        run: |
          sudo -n env -i PATH="$PATH" MCC_ARM64_CANDIDATE_SHA="$MCC_ARM64_CANDIDATE_SHA" MCC_ARM64_PACKAGE="$MCC_ARM64_PACKAGE" MCC_ARM64_CANDIDATE="$MCC_ARM64_CANDIDATE" MCC_ARM64_LEGACY="$MCC_ARM64_LEGACY" MCC_ARM64_EVIDENCE="$MCC_ARM64_EVIDENCE" unshare --mount --net --pid --fork --mount-proc --propagation private --kill-child /bin/bash "$MCC_ARM64_PACKAGE/validation/arm64/offline-tests.sh"
      - name: Retain synthetic summaries and bounded metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm64-compatibility-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mcc-arm64-evidence/compatibility/*.json
            ${{ runner.temp }}/mcc-arm64-evidence/compatibility/*.jsonl
            ${{ runner.temp }}/mcc-arm64-evidence/compatibility/*.log
            ${{ runner.temp }}/mcc-arm64-evidence/compatibility/*.txt
          retention-days: 3

  deployment:
    name: Probe and validate disposable native deployment integration
    if: >-
      github.repository == 'Recklessrage17/maintenance-command-center' &&
      inputs.ubuntu_browser_diagnostics != true &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["codex/mcc-2-0-0-release-candidate","chore/remove-old-qa-screenshots-20261021"]'), github.event.pull_request.head.ref)))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      CI: 'true'
      MCC_ARM64_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      MCC_ARM64_PACKAGE: ${{ github.workspace }}/validation-package
      MCC_ARM64_CANDIDATE: ${{ github.workspace }}/candidate
      MCC_ARM64_LEGACY: ${{ github.workspace }}/legacy-source
    steps:
      - name: Set isolated evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/mcc-arm64-evidence/deployment"
          printf 'MCC_ARM64_EVIDENCE=%s/mcc-arm64-evidence/deployment\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out validation package head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          path: validation-package
          persist-credentials: false
      - name: Check out exact approved 2.0.0 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Check out incompatible historical source for refusal test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3929a957d4f633d8129997ed1eec818e2e3efbdb
          path: legacy-source
          persist-credentials: false
      - name: Set up native Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          architecture: arm64
      - name: Verify pinned inputs and architecture
        run: |
          test "$(uname -m)" = aarch64
          node "$MCC_ARM64_PACKAGE/validation/arm64/verify-package.mjs"
          node "$MCC_ARM64_PACKAGE/validation/arm64/runtime.mjs"
      - name: Install locked candidate dependencies and build
        timeout-minutes: 8
        run: |
          npm ci --prefix "$MCC_ARM64_CANDIDATE" --include=dev --no-audit --no-fund
          npm ci --prefix "$MCC_ARM64_CANDIDATE/frontend" --include=dev --no-audit --no-fund
          npm ci --prefix "$MCC_ARM64_CANDIDATE/backend" --include=dev --no-audit --no-fund
          NODE_ENV=production npm run build --prefix "$MCC_ARM64_CANDIDATE" > "$MCC_ARM64_EVIDENCE/build.log" 2>&1
      - name: Probe real mount and private systemd support before native tests
        timeout-minutes: 13
        run: /bin/bash "$MCC_ARM64_PACKAGE/validation/arm64/run-container.sh"
      - name: Publish explicit verification status
        if: always()
        run: |
          if test -f "$MCC_ARM64_EVIDENCE/deployment-status.json"; then
            cat "$MCC_ARM64_EVIDENCE/deployment-status.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Deployment integration NOT VERIFIED: see failed setup/test step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Persistent SSD, reboot, complete updater orchestration and Pi acceptance require separate staging even when container cases pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain capability evidence and native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm64-deployment-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mcc-arm64-evidence/deployment/*.json
            ${{ runner.temp }}/mcc-arm64-evidence/deployment/*.log
            ${{ runner.temp }}/mcc-arm64-evidence/deployment/*.txt
            ${{ runner.temp }}/mcc-arm64-evidence/deployment/*.sh
            ${{ runner.temp }}/mcc-arm64-evidence/deployment/memory-4g/*.json
            ${{ runner.temp }}/mcc-arm64-evidence/deployment/memory-4g/*.jsonl
            ${{ runner.temp }}/mcc-arm64-evidence/deployment/memory-4g/*.log
          retention-days: 3
