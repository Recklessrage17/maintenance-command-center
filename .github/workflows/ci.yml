name: MCC CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcc-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the original assertion and exact production source in the same hosted
  # environment as the candidate while investigating PR #213's keyboard failure.
  # This diagnostic comparison is scoped to this PR, not future releases.
  baseline-keyboard-comparison:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 213
    name: Exact b8d1303 keyboard comparison (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      MCC_PLAYWRIGHT_FRONTEND_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b8d13033baaf181a519b067db3f98556a260c88e
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Build exact baseline and install Chromium
        run: |
          test "$(git rev-parse HEAD)" = b8d13033baaf181a519b067db3f98556a260c88e
          npm ci --include=dev --no-audit --no-fund
          npm ci --prefix frontend --include=dev --no-audit --no-fund
          npm run build --prefix frontend
          npx --no-install playwright install --with-deps chromium
      # This intentionally runs the original, immutable b8d1303 test under
      # the same 20x contention load. Its known intermittent focus regression
      # is historical evidence, not a release gate for PR #213. The candidate
      # job below retains a mandatory 20x zero-retry keyboard gate.
      - name: Repeat unchanged baseline keyboard assertion under contention (diagnostic)
        id: baseline_keyboard
        continue-on-error: true
        run: npm run test:playwright -- tests/maintenance-lab-background.spec.ts --project=desktop-chromium --grep 'long Machine Library' --repeat-each=20 --forbid-only --workers=2 --retries=0
      - name: Report immutable baseline keyboard diagnostic
        if: always() && steps.baseline_keyboard.outcome != 'skipped'
        env:
          BASELINE_OUTCOME: ${{ steps.baseline_keyboard.outcome }}
        run: |
          printf '### Immutable b8d1303 baseline keyboard comparison: %s (diagnostic only)\n' "$BASELINE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BASELINE_OUTCOME" != success ]; then
            echo "::warning title=Historical baseline keyboard flakiness::The unchanged b8d1303 keyboard test failed in 20x stress. This is a non-blocking diagnostic; candidate 20x keyboard and full browser regressions remain strict zero-retry release gates."
          fi
      - name: Verify baseline runtime cleanup
        if: always()
        run: |
          npm run test:playwright:cleanup
          node --input-type=module -e "import fs from 'node:fs'; const p='tmp/playwright-runs'; if(fs.existsSync(p) && fs.readdirSync(p).length) throw new Error('Baseline runtime retained; inspect diagnostics before explicit cleanup');"
      - name: Retain baseline comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b8d1303-keyboard-comparison-${{ github.run_attempt }}
          path: diagnostics/playwright/
          retention-days: 90

  build-and-regression:
    name: Build and complete browser regressions (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      NODE_ENV: test
      # Preserve the release browser harness (mocked APIs served by Vite).
      # Each managed invocation allocates its own loopback port.
      MCC_PLAYWRIGHT_FRONTEND_ONLY: '1'
      MCC_BIND_HOST: 127.0.0.1
      MCC_UPDATE_MODE: ''
      MCC_HTTPS_MODE: ''
      SESSION_SECRET: mcc-ci-disposable-session-only
      SMTP_HOST: ''
      SMTP_PORT: ''
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/mcc-ci-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/mcc-ci-evidence/candidate-sha.txt"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Prepare isolated test storage
        run: |
          runtime=$(mktemp -d "$RUNNER_TEMP/mcc-ci.XXXXXXXX")
          printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$runtime/owner"
          printf '%s\n' \
            "MCC_CI_RUNTIME=$runtime" \
            "MCC_DATA_DIR=$runtime/data" \
            "MCC_UPLOADS_DIR=$runtime/uploads" \
            "MCC_BACKUPS_DIR=$runtime/backups" \
            "MCC_RECOVERY_DIR=$runtime/recovery" \
            "MCC_PM_EXCEL_DIR=$runtime/pm-excel" \
            "MCC_PM_WORK_ORDER_DIR=$runtime/pm-work-orders" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        timeout-minutes: 5
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm ci --prefix frontend --include=dev --no-audit --no-fund
          npm ci --prefix backend --include=dev --no-audit --no-fund

      - name: Frontend TypeScript and production build
        timeout-minutes: 3
        env:
          NODE_ENV: production
        run: npm run build --prefix frontend

      - name: Backend TypeScript build
        timeout-minutes: 3
        env:
          NODE_ENV: production
        run: npm run build --prefix backend

      - name: Application smoke test
        timeout-minutes: 2
        env:
          PORT: '4298'
          MCC_SMOKE_URL: http://127.0.0.1:4298
        run: npm run smoke

      - name: Isolated backend and authorization regressions
        timeout-minutes: 3
        run: |
          node tests/backend-dependency-security-regression.mjs
          node tests/authentication-password-change-regression.mjs
          node tests/system-update-api.mjs

      - name: Install Chromium and Ubuntu browser dependencies
        timeout-minutes: 5
        run: npx --no-install playwright install --with-deps chromium

      # Requisition PDFs are converted from XLSX, which requires LibreOffice Calc.
      # Writer alone provides soffice but lacks the spreadsheet import filter.
      # PyMuPDF below inspects PDF output; it does not perform XLSX conversion.
      - name: Install LibreOffice Calc and verify actual requisition XLSX conversion
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer
          command -v soffice
          command -v libreoffice
          soffice --headless --version
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/mcc-requisition-convert.XXXXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          soffice -env:UserInstallation="file://$smoke_dir/profile" --headless --convert-to pdf --outdir "$smoke_dir" backend/templates/requisition-under-100.xlsx
          test -s "$smoke_dir/requisition-under-100.pdf"
          printf 'XLSX-to-PDF smoke conversion passed; output size: %s bytes\n' "$(wc -c < "$smoke_dir/requisition-under-100.pdf")"

      # Native Chromium print-preview tests require a virtual X display on Ubuntu.
      # Installation alone does not enable the display; xvfb-run is configured separately.
      - name: Install virtual display for headed Chromium
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          command -v Xvfb
          command -v xvfb-run

      # Save as PDF is not a color-capable printer and its PDF preview has
      # no Color / Black-and-white control. Install one disposable CUPS queue
      # so the native Chromium test exercises a real visible printer setting.
      # The backend points to a closed loopback port: CI only previews; it
      # never submits a physical print job.
      - name: Provision color-capable CI-only printer
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends cups cups-client
          sudo service cups start
          # Enumerating CUPS backends requires administrator privileges on
          # Ubuntu 24.04. Do not relax the CUPS access policy globally.
          sudo lpinfo -v | grep -E '^network socket$'
          cat > "$RUNNER_TEMP/mcc-ci-color.ppd" <<'PPD'
          *PPD-Adobe: "4.3"
          *FormatVersion: "4.3"
          *FileVersion: "1.0"
          *LanguageVersion: English
          *LanguageEncoding: ISOLatin1
          *PCFileName: "MCCCOLOR.PPD"
          *Manufacturer: "MCC CI"
          *Product: "(MCC Virtual PostScript)"
          *ModelName: "MCC CI Color Printer"
          *ShortNickName: "MCC CI Color"
          *NickName: "MCC CI Color Printer"
          *PSVersion: "(3010.000) 0"
          *LanguageLevel: "3"
          *ColorDevice: True
          *DefaultColorSpace: RGB
          *FileSystem: False
          *Throughput: "1"
          *HWMargins: "0 0 0 0"
          *OpenUI *PageSize/Page Size: PickOne
          *DefaultPageSize: Letter
          *PageSize Letter/US Letter: "<</PageSize[612 792]>>setpagedevice"
          *CloseUI: *PageSize
          *OpenUI *PageRegion/Page Region: PickOne
          *DefaultPageRegion: Letter
          *PageRegion Letter/US Letter: "<</PageSize[612 792]>>setpagedevice"
          *CloseUI: *PageRegion
          *ImageableArea Letter: "0 0 612 792"
          *PaperDimension Letter: "612 792"
          *OpenUI *ColorModel/Color Mode: PickOne
          *OrderDependency: 10 AnySetup *ColorModel
          *DefaultColorModel: RGB
          *ColorModel RGB/Color: "<</ProcessColorModel /DeviceRGB>>setpagedevice"
          *ColorModel Gray/Black and White: "<</ProcessColorModel /DeviceGray>>setpagedevice"
          *CloseUI: *ColorModel
          PPD
          sudo lpadmin -p MCC_CI_COLOR -E -v socket://127.0.0.1:19999 -P "$RUNNER_TEMP/mcc-ci-color.ppd"
          sudo lpadmin -d MCC_CI_COLOR
          lpstat -p MCC_CI_COLOR
          lpoptions -p MCC_CI_COLOR -l | grep -E 'ColorModel.*RGB.*Gray'
          printf '%s\n' 'CI_PRINT_TEST_PRINTER=MCC_CI_COLOR' >> "$GITHUB_ENV"

      - name: Install pinned PDF inspection dependency
        timeout-minutes: 3
        run: |
          # Isolate packages inside owned storage without venv symlinks that cleanup rejects.
          export PYTHONPATH="$MCC_CI_RUNTIME/pdf-python"
          python3 -m pip install --target "$PYTHONPATH" --no-cache-dir --only-binary=:all: --no-deps PyMuPDF==1.28.0
          python3 -c "import fitz; assert fitz.VersionBind == '1.28.0'; print('PyMuPDF', fitz.VersionBind)"
          printf '%s\n' 'PYTHON=python3' "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Managed Playwright ownership and cleanup safety checks
        timeout-minutes: 6
        run: npm run test:playwright:cleanup-checks

      - name: Recheck release layout and keyboard failures before full suite
        timeout-minutes: 5
        run: npm run test:playwright -- tests/warning-issue-lifecycle.spec.ts tests/maintenance-lab-background.spec.ts tests/machine-retirement-archive.spec.mts tests/maintenance-team-roster.spec.ts tests/user-security-permissions.spec.ts --grep 'technician controls|long Machine Library|archive, search|roster Escape|module badges' --forbid-only --workers=2 --retries=0

      - name: Verify native keyboard scroll in independent executions under contention
        timeout-minutes: 6
        run: npm run test:playwright -- tests/maintenance-lab-background.spec.ts --project=desktop-chromium --grep 'long Machine Library' --repeat-each=20 --forbid-only --workers=2 --retries=0

      # Native Chromium print preview runs headed; validate one real scenario
      # inside a virtual display before running all desktop/mobile regressions.
      - name: Verify native Chromium print preview under Xvfb
        timeout-minutes: 10
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" npm run test:playwright -- \
            tests/issue-208-native-print-preview.spec.mts \
            --project=desktop-chromium \
            --grep 'Patch 1 under blank native Chromium PDF' \
            --forbid-only --workers=1 --retries=0

      - name: Desktop and mobile browser regressions
        # A complete zero-retry run took 28.2 minutes on the hosted runner.
        # This is orchestration headroom; per-test/assertion deadlines stay intact.
        timeout-minutes: 40
        run: |
          # Discover every tracked browser spec, including the gated cleanup probe. Node test modules
          # keep their native harness; no browser project or release spec is omitted.
          mapfile -t specs < <(git ls-files 'tests/*.spec.ts' 'tests/*.spec.mts')
          # Keep the current coverage floor while allowing future specs to be added.
          if [ "${#specs[@]}" -lt 59 ]; then
            printf 'Expected at least 59 browser specs; found %s. Check for lost regression coverage.\n' "${#specs[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${specs[@]}" | grep -Fxq 'tests/asset-maintenance-record-pdf.spec.ts'
          printf '%s\n' "${specs[@]}" > "$RUNNER_TEMP/mcc-ci-evidence/browser-specs.txt"
          xvfb-run -a -s "-screen 0 1920x1200x24" npm run test:playwright -- "${specs[@]}" --forbid-only --workers=2 --retries=0 --max-failures=5

      - name: Verify managed runtime cleanup
        if: always()
        run: |
          npm run test:playwright:cleanup
          node --input-type=module -e "import fs from 'node:fs'; const p='tmp/playwright-runs'; if(fs.existsSync(p) && fs.readdirSync(p).length) throw new Error('Managed runtime retained: inspect diagnostics and processes before explicit cleanup');"

      - name: Finalize owned smoke and API storage
        if: always() && env.MCC_CI_RUNTIME != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { inspectTree } from './scripts/playwright-storage.mjs';
          const directory = path.resolve(process.env.MCC_CI_RUNTIME);
          const parent = fs.realpathSync(process.env.RUNNER_TEMP);
          if (path.dirname(directory) !== parent || !/^mcc-ci\.[a-zA-Z0-9]+$/.test(path.basename(directory)) ||
              fs.lstatSync(directory).isSymbolicLink() || fs.realpathSync(directory) !== directory ||
              fs.readFileSync(path.join(directory, 'owner'), 'utf8') !== `${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}`) {
            throw new Error('Refusing unowned CI storage cleanup');
          }
          for (const pid of fs.readdirSync('/proc').filter(name => /^\d+$/.test(name))) {
            let command;
            try { command = fs.readFileSync(`/proc/${pid}/cmdline`, 'utf8').split('\0'); }
            catch (error) { if (error.code === 'ENOENT' || error.code === 'ESRCH') continue; throw error; }
            if (!command.some(arg => /(?:^|\/)backend\/dist\/server\/index\.js$/.test(arg))) continue;
            let environment;
            try { environment = fs.readFileSync(`/proc/${pid}/environ`, 'utf8'); }
            catch (error) { if (error.code === 'ENOENT' || error.code === 'ESRCH') continue; throw error; }
            if (environment.includes(directory)) throw new Error(`Owned server ${pid} is still active; storage retained`);
          }
          inspectTree(directory);
          const recovery = path.join(directory, 'recovery');
          if (fs.existsSync(recovery) && fs.readdirSync(recovery).length) {
            fs.renameSync(recovery, path.join(parent, 'mcc-ci-evidence', 'recovery'));
          }
          fs.rmSync(directory, { recursive: true });
          NODE

      - name: Retain source and browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exact-source-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcc-ci-evidence/
          retention-days: 90

      - name: Retain managed browser diagnostics for review
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            diagnostics/playwright/
          retention-days: 90
          if-no-files-found: ignore
