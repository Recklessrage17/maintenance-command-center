name: MCC CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcc-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-regression:
    name: Build and complete browser regressions (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      NODE_ENV: test
      # Preserve the release browser harness (mocked APIs served by Vite).
      # Each managed invocation allocates its own loopback port.
      MCC_PLAYWRIGHT_FRONTEND_ONLY: '1'
      MCC_BIND_HOST: 127.0.0.1
      MCC_UPDATE_MODE: ''
      MCC_HTTPS_MODE: ''
      SESSION_SECRET: mcc-ci-disposable-session-only
      SMTP_HOST: ''
      SMTP_PORT: ''
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/mcc-ci-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/mcc-ci-evidence/candidate-sha.txt"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Prepare isolated test storage
        run: |
          runtime=$(mktemp -d "$RUNNER_TEMP/mcc-ci.XXXXXXXX")
          printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$runtime/owner"
          printf '%s\n' \
            "MCC_CI_RUNTIME=$runtime" \
            "MCC_DATA_DIR=$runtime/data" \
            "MCC_UPLOADS_DIR=$runtime/uploads" \
            "MCC_BACKUPS_DIR=$runtime/backups" \
            "MCC_RECOVERY_DIR=$runtime/recovery" \
            "MCC_PM_EXCEL_DIR=$runtime/pm-excel" \
            "MCC_PM_WORK_ORDER_DIR=$runtime/pm-work-orders" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        timeout-minutes: 5
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm ci --prefix frontend --include=dev --no-audit --no-fund
          npm ci --prefix backend --include=dev --no-audit --no-fund

      - name: Frontend TypeScript and production build
        timeout-minutes: 3
        env:
          NODE_ENV: production
        run: npm run build --prefix frontend

      - name: Backend TypeScript build
        timeout-minutes: 3
        env:
          NODE_ENV: production
        run: npm run build --prefix backend

      - name: Application smoke test
        timeout-minutes: 2
        env:
          PORT: '4298'
          MCC_SMOKE_URL: http://127.0.0.1:4298
        run: npm run smoke

      - name: Isolated backend and authorization regressions
        timeout-minutes: 3
        run: |
          node tests/backend-dependency-security-regression.mjs
          node tests/authentication-password-change-regression.mjs
          node tests/system-update-api.mjs

      - name: Install Chromium and Ubuntu browser dependencies
        timeout-minutes: 5
        run: npx --no-install playwright install --with-deps chromium

      - name: Managed Playwright ownership and cleanup safety checks
        timeout-minutes: 6
        run: npm run test:playwright:cleanup-checks

      - name: Recheck release layout and keyboard failures before full suite
        timeout-minutes: 5
        run: npm run test:playwright -- tests/warning-issue-lifecycle.spec.ts tests/maintenance-lab-background.spec.ts tests/machine-retirement-archive.spec.mts tests/maintenance-team-roster.spec.ts tests/user-security-permissions.spec.ts --grep 'technician controls|long Machine Library|archive, search|roster Escape|module badges' --forbid-only --workers=2 --retries=0

      - name: Verify native keyboard scroll in independent executions under contention
        timeout-minutes: 6
        run: npm run test:playwright -- tests/maintenance-lab-background.spec.ts --project=desktop-chromium --grep 'long Machine Library' --repeat-each=20 --forbid-only --workers=2 --retries=0

      - name: Desktop and mobile browser regressions
        # A complete zero-retry run took 28.2 minutes on the hosted runner.
        # This is orchestration headroom; per-test/assertion deadlines stay intact.
        timeout-minutes: 40
        run: |
          # Discover every tracked browser spec, including the gated cleanup probe. Node test modules
          # keep their native harness; no browser project or release spec is omitted.
          mapfile -t specs < <(git ls-files 'tests/*.spec.ts' 'tests/*.spec.mts')
          # Keep the current coverage floor while allowing future specs to be added.
          if [ "${#specs[@]}" -lt 59 ]; then
            printf 'Expected at least 59 browser specs; found %s. Check for lost regression coverage.\n' "${#specs[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${specs[@]}" | grep -Fxq 'tests/asset-maintenance-record-pdf.spec.ts'
          printf '%s\n' "${specs[@]}" > "$RUNNER_TEMP/mcc-ci-evidence/browser-specs.txt"
          npm run test:playwright -- "${specs[@]}" --forbid-only --workers=2 --retries=0 --max-failures=5

      - name: Verify managed runtime cleanup
        if: always()
        run: |
          npm run test:playwright:cleanup
          node --input-type=module -e "import fs from 'node:fs'; const p='tmp/playwright-runs'; if(fs.existsSync(p) && fs.readdirSync(p).length) throw new Error('Managed runtime retained: inspect diagnostics and processes before explicit cleanup');"

      - name: Finalize owned smoke and API storage
        if: always() && env.MCC_CI_RUNTIME != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { inspectTree } from './scripts/playwright-storage.mjs';
          const directory = path.resolve(process.env.MCC_CI_RUNTIME);
          const parent = fs.realpathSync(process.env.RUNNER_TEMP);
          if (path.dirname(directory) !== parent || !/^mcc-ci\.[a-zA-Z0-9]+$/.test(path.basename(directory)) ||
              fs.lstatSync(directory).isSymbolicLink() || fs.realpathSync(directory) !== directory ||
              fs.readFileSync(path.join(directory, 'owner'), 'utf8') !== `${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}`) {
            throw new Error('Refusing unowned CI storage cleanup');
          }
          for (const pid of fs.readdirSync('/proc').filter(name => /^\d+$/.test(name))) {
            let command;
            try { command = fs.readFileSync(`/proc/${pid}/cmdline`, 'utf8').split('\0'); }
            catch (error) { if (error.code === 'ENOENT' || error.code === 'ESRCH') continue; throw error; }
            if (!command.some(arg => /(?:^|\/)backend\/dist\/server\/index\.js$/.test(arg))) continue;
            let environment;
            try { environment = fs.readFileSync(`/proc/${pid}/environ`, 'utf8'); }
            catch (error) { if (error.code === 'ENOENT' || error.code === 'ESRCH') continue; throw error; }
            if (environment.includes(directory)) throw new Error(`Owned server ${pid} is still active; storage retained`);
          }
          inspectTree(directory);
          const recovery = path.join(directory, 'recovery');
          if (fs.existsSync(recovery) && fs.readdirSync(recovery).length) {
            fs.renameSync(recovery, path.join(parent, 'mcc-ci-evidence', 'recovery'));
          }
          fs.rmSync(directory, { recursive: true });
          NODE

      - name: Retain source and browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exact-source-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcc-ci-evidence/
          retention-days: 90

      - name: Retain managed browser diagnostics for review
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            diagnostics/playwright/
          retention-days: 90
          if-no-files-found: ignore
